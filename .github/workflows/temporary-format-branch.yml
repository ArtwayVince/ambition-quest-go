name: Temporary branch formatter

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/tailored-ambition-journey-stages
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile

      - name: Format the two files flagged by CI
        run: bunx prettier --write src/routes/index.tsx src/routes/dashboard.tsx

      - name: Commit formatting if needed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/routes/index.tsx src/routes/dashboard.tsx
            git commit -m "Format files flagged by CI"
            git push origin HEAD:feat/tailored-ambition-journey-stages
          else
            echo "Files are already formatted."
          fi
