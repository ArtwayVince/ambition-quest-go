name: Format tour management PR

on:
  push:
    branches:
      - feat/manage-tour-points-and-media

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/manage-tour-points-and-media
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format changed files
        run: bunx prettier --write src/routes/provider.media.tsx src/routes/tour.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Files already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/provider.media.tsx src/routes/tour.tsx
          git commit -m "style: format tour management files"
          git push origin HEAD:feat/manage-tour-points-and-media
