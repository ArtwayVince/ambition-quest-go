name: Temporary participation formatter

on:
  push:
    branches:
      - feat/self-reported-participation-records

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format changed TypeScript files
        run: bunx prettier --write src/lib/store.tsx src/routes/bookings.tsx src/test/rules.test.ts
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/lib/store.tsx src/routes/bookings.tsx src/test/rules.test.ts
            git commit -m "Format participation changes"
            git push
          fi
