name: JET OFF CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    name: Build, lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile

      - name: Format only Phase 1 files
        run: bunx prettier --write src/routes/index.tsx src/routes/dashboard.tsx src/routes/auth.tsx src/components/Shell.tsx

      - name: Commit formatting changes to the pull request branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/index.tsx src/routes/dashboard.tsx src/routes/auth.tsx src/components/Shell.tsx
          if ! git diff --cached --quiet; then
            git commit -m "Format JET OFF Phase 1 files"
            git push
          else
            echo "Phase 1 files already formatted."
          fi

      - name: Build application
        run: bun run build

      - name: Lint Phase 1 files
        run: bunx eslint src/routes/index.tsx src/routes/dashboard.tsx src/routes/auth.tsx src/components/Shell.tsx

      - name: Run tests
        if: always()
        run: bun run test
