name: JET OFF CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Build, lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile

      - name: Identify changed TypeScript files
        id: changed-files
        shell: bash
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- '*.ts' '*.tsx')
          {
            echo 'files<<EOF'
            echo "$files"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Check formatting of changed files
        if: steps.changed-files.outputs.files != ''
        shell: bash
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.files }}
        run: |
          mapfile -t files <<< "$CHANGED_FILES"
          bunx prettier --check "${files[@]}"

      - name: Build application
        run: bun run build

      - name: Lint changed files
        if: steps.changed-files.outputs.files != ''
        shell: bash
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.files }}
        run: |
          mapfile -t files <<< "$CHANGED_FILES"
          bunx eslint "${files[@]}"

      - name: Run tests
        run: bun run test
